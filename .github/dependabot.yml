version: 2
updates:
  # Keep npm dependencies current (security + the Vite/ESLint toolchain).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch non-major updates into one PR to cut review noise.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pinned to current major versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
