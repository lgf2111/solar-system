<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/planet.css" />
    <title id="title"></title>
  </head>
  <body>
    <div class="bg">
      <div class="stars"></div>
      <div class="twinkling"></div>
      <div class="clouds"></div>
    </div>
    <main class="content">
      <div class="name"><h1 id="name">About</h1></div>
      <div class="spec"></div>
      <div class="img"></div>
      <div class="fact">
        <div id="fact"></div>
        <button id="more-facts" class="more-facts" type="button">More Facts</button>
      </div>
    </main>

    <nav class="site-nav" aria-label="Primary">
      <a class="nav-link" href="index.html">The Solar System</a>
      <a class="nav-link" href="info.html">About Solar System</a>
      <div class="nav-planets">
        <button
          id="planet-toggle"
          class="nav-link"
          type="button"
          aria-expanded="false"
          aria-controls="planet-menu"
        >
          Planets
        </button>
        <ul id="planet-menu" class="planet-menu" hidden>
          <li><button type="button" data-planet="sun">Sun (Star)</button></li>
          <li><button type="button" data-planet="mercury">Mercury</button></li>
          <li><button type="button" data-planet="venus">Venus</button></li>
          <li><button type="button" data-planet="earth">Earth</button></li>
          <li><button type="button" data-planet="mars">Mars</button></li>
          <li><button type="button" data-planet="jupiter">Jupiter</button></li>
          <li><button type="button" data-planet="saturn">Saturn</button></li>
          <li><button type="button" data-planet="uranus">Uranus</button></li>
          <li><button type="button" data-planet="neptune">Neptune</button></li>
        </ul>
      </div>
    </nav>

    <script src="./js/planet.js" type="module"></script>
    <script src="./js/index.js" type="module"></script>
  </body>
</html>
