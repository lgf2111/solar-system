<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Tour</title>
  </head>

  <body>
    <canvas id="bg"></canvas>

    <button
      id="feedback-open"
      class="feedback-fab"
      type="button"
      aria-haspopup="dialog"
      aria-controls="feedback-modal"
      aria-label="Send feedback"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 5.5h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H9l-4 3.5V16H4a1 1 0 0 1-1-1v-8.5a1 1 0 0 1 1-1Z"
        />
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          d="M7.5 9.5h9M7.5 12.5h5.5"
        />
      </svg>
    </button>

    <div
      id="feedback-modal"
      class="feedback-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedback-title"
      hidden
    >
      <div class="feedback-card">
        <button class="feedback-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3L16.9 4.3Z"
            />
          </svg>
        </button>
        <h2 id="feedback-title">Send feedback</h2>
        <div class="star-rating" role="radiogroup" aria-label="Rating">
          <button
            type="button"
            class="star"
            data-value="1"
            aria-label="1 star"
            aria-checked="false"
            role="radio"
          >
            <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="m12 2 2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6L12 2Z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="star"
            data-value="2"
            aria-label="2 stars"
            aria-checked="false"
            role="radio"
          >
            <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="m12 2 2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6L12 2Z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="star"
            data-value="3"
            aria-label="3 stars"
            aria-checked="false"
            role="radio"
          >
            <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="m12 2 2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6L12 2Z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="star"
            data-value="4"
            aria-label="4 stars"
            aria-checked="false"
            role="radio"
          >
            <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="m12 2 2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6L12 2Z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="star"
            data-value="5"
            aria-label="5 stars"
            aria-checked="false"
            role="radio"
          >
            <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="m12 2 2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6L12 2Z"
              />
            </svg>
          </button>
        </div>
        <label class="feedback-label" for="feedback-comment">Comments</label>
        <textarea
          id="feedback-comment"
          class="feedback-comment"
          rows="4"
          placeholder="Tell us what you think"
        ></textarea>
        <button id="feedback-submit" class="feedback-submit" type="button">Send feedback</button>
      </div>
    </div>

    <nav class="site-nav" aria-label="Primary">
      <a class="nav-link" href="index.html" aria-current="page">The Solar System</a>
      <a class="nav-link" href="info.html">About Solar System</a>
      <div class="nav-planets">
        <button
          id="planet-toggle"
          class="nav-link"
          type="button"
          aria-expanded="false"
          aria-controls="planet-menu"
        >
          Planets
        </button>
        <ul id="planet-menu" class="planet-menu" hidden>
          <li><button type="button" data-planet="sun">Sun (Star)</button></li>
          <li><button type="button" data-planet="mercury">Mercury</button></li>
          <li><button type="button" data-planet="venus">Venus</button></li>
          <li><button type="button" data-planet="earth">Earth</button></li>
          <li><button type="button" data-planet="mars">Mars</button></li>
          <li><button type="button" data-planet="jupiter">Jupiter</button></li>
          <li><button type="button" data-planet="saturn">Saturn</button></li>
          <li><button type="button" data-planet="uranus">Uranus</button></li>
          <li><button type="button" data-planet="neptune">Neptune</button></li>
        </ul>
      </div>
    </nav>

    <script src="./js/main.js" type="module"></script>
    <script src="./js/feedback.js" type="module"></script>
    <script src="./js/index.js" type="module"></script>
  </body>
</html>
